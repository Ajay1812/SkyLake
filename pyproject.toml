[project]
name = "skylake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.64",
    "boto3-stubs~=1.43.64",
    "jupyter>=1.1.1",
    "pyspark~=4.0.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "apache-airflow==2.10.5",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
