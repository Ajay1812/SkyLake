version: 2

sources:
  - name: flights
    schema: flights
    tables:
      - name: flight_events
        description: >
          Cleaned flight delay records, written by the Spark pipeline
          (spark/iceberg_writer.py) as an Iceberg table.

models:
  - name: stg_flights
    description: Passthrough select of the raw flight_events Iceberg table.
    columns:
      - name: FL_DATE
        description: Scheduled flight date.
        tests:
          - not_null
      - name: OP_CARRIER
        description: Operating airline carrier code.
        tests:
          - not_null
      - name: ORIGIN
        tests:
          - not_null
      - name: DEST
        tests:
          - not_null
      - name: CANCELLED
        description: 1 if the flight was cancelled, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: DIVERTED
        description: 1 if the flight was diverted, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
